// Catches at least the following modules: ModuleCurvedSolarPanel, ModuleDeployableSolarPanel, ModuleROSolarPanel
// EC panels (chargeRate > 0). Skip ThermalPower; skip chargeRate = 0 tracking dummies.
@PART:HAS[@MODULE[ModuleDeployableSolarPanel]:HAS[#chargeRate[>0],~resourceName[ThermalPower]]]:NEEDS[!Kerbalism,!RealismOverhaul]:FOR[zWeatherDrivenSolarPanel]
{
	@MODULE[ModuleDeployableSolarPanel]:HAS[#chargeRate[>0],~resourceName[ThermalPower]],*
	{
		%useKopernicusSolarPanels = false
	}
	+MODULE[ModuleDeployableSolarPanel]:HAS[#chargeRate[>0],~resourceName[ThermalPower]],*
	{
		// delete all values
		-* = delete
		// delete all possible nodes
		-powerCurve {}
		//-temperatureEfficCurve {}
		-timeEfficCurve {}
		-UPGRADES {}
		// rename the module to weatherDrivenSolarPanel
		name = weatherDrivenSolarPanel
	}
}

